name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            rust_targets: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets == ''

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets != ''
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: PublishKit ${{ github.ref_name }}
          releaseBody: |
            PublishKit ${{ github.ref_name }}

            - Windows 10/11: the `x64-setup.exe`
            - macOS Apple Silicon (M1 or later): the `aarch64.dmg`
            - macOS Intel: the `x64.dmg`

            These builds are not code-signed. On Windows, if SmartScreen says it protected your PC, choose More info, then Run anyway. On macOS, if the system says the developer cannot be verified, open System Settings → Privacy & Security and choose Open Anyway.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
