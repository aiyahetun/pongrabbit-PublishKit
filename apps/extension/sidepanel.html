<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PublishKit</title>
    <style>
      body {
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        width: 100%;
        min-width: 320px;
        margin: 0;
        padding: 16px;
        color: #1b1c19;
        background: #f7f6f3;
        box-sizing: border-box;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 12px;
        font-size: 12px;
        color: #8a8278;
      }
      label {
        display: block;
        font-size: 11px;
        color: #8a8278;
        margin: 10px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d1c5b3;
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        border: 1px solid #d1c5b3;
        border-radius: 8px;
        background: #fff;
        padding: 8px 10px;
        cursor: pointer;
        font: inherit;
      }
      button.primary {
        background: #b8924a;
        border-color: #b8924a;
        color: #fdfcfa;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #status {
        margin-top: 12px;
        font-size: 12px;
        min-height: 18px;
      }
      #status.ok {
        color: #3a6a4a;
      }
      #status.error {
        color: #b42318;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 12px 0 0;
        max-height: calc(100vh - 280px);
        overflow: auto;
      }
      li {
        padding: 10px 0;
        border-top: 1px solid #e4e2dd;
        font-size: 12px;
      }
      li.task-item.done {
        opacity: 0.65;
      }
      li strong {
        display: block;
        margin-bottom: 2px;
      }
      li span {
        color: #8a8278;
      }
      li.empty {
        color: #8a8278;
      }
      .task-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-top: 8px;
      }
      .task-actions .url-input {
        grid-column: 1 / -1;
      }
      .task-actions button {
        flex: unset;
        font-size: 11px;
        padding: 6px 8px;
      }
      .task-actions button.primary {
        grid-column: 1 / -1;
      }
      .task-actions button.undo {
        grid-column: 1 / -1;
        display: none;
      }
      .task-actions button.undo.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>PublishKit</h1>
    <p id="hint">在桌面端「设置 → 浏览器插件」复制端口与 Token。</p>
    <label for="port">API 端口</label>
    <input id="port" type="number" min="1" max="65535" />
    <label for="token">配对 Token</label>
    <input id="token" type="text" placeholder="粘贴配对 Token" />
    <div class="actions">
      <button id="save" type="button">保存</button>
      <button id="test" class="primary" type="button">测试连接</button>
    </div>
    <button id="today" type="button" style="width: 100%; margin-top: 8px">加载今日待发</button>
    <div id="status"></div>
    <ul id="tasks"></ul>
    <script src="popup.js"></script>
  </body>
</html>
